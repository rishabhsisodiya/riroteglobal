name: Deploy site to GitHub Pages

# Builds the hand-authored static site at the repo root together with the Astro
# "prep" hub in prep-site/ (which outputs to ./prep), then publishes the combined
# result. Set Pages source to "GitHub Actions" in repo Settings → Pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prep-site/package-lock.json

      - name: Build the prep hub
        working-directory: prep-site
        run: |
          npm ci
          npm run build      # astro build -> ../prep, then pagefind index

      - name: Assemble publish directory
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='_site/' \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='prep-site/' \
            --exclude='prep-notes-src/' \
            --exclude='node_modules/' \
            ./ _site/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
